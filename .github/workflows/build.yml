name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm switch-dev switch-curl switch-freetype switch-harfbuzz switch-zlib

      - name: Build
        run: make -j"$(nproc)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-cloud-sync
          path: switch-cloud-sync.nro
          if-no-files-found: error
