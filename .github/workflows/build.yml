name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PORTLIBS: /opt/devkitpro/portlibs/switch
      PATH: /opt/devkitpro/pacman/bin:/opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:/opt/devkitpro/portlibs/switch/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eu
          echo "=== devkitPro layout ==="
          ls /opt/devkitpro || true

          PAC="$(command -v pacman || command -v dkp-pacman || true)"
          if [ -z "$PAC" ] && [ -x /opt/devkitpro/pacman/bin/pacman ]; then
            PAC=/opt/devkitpro/pacman/bin/pacman
          fi
          if [ -z "$PAC" ]; then
            echo "ERROR: pacman not found"
            exit 1
          fi
          echo "using $PAC"

          "$PAC" -Syu --noconfirm --needed --disable-download-timeout || "$PAC" -Sy --noconfirm --needed
          "$PAC" -S --noconfirm --needed --disable-download-timeout \
            switch-dev switch-curl switch-freetype switch-harfbuzz switch-zlib

          command -v aarch64-none-elf-g++
          command -v curl-config

      - name: Build
        run: make -j"$(nproc)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-cloud-sync
          path: switch-cloud-sync.nro
          if-no-files-found: error
